<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Ekalavya LMS - Officers Training College, AMC Centre and College</title>
    <meta name="description" content="Secure login portal for Ekalavya LMS - Air-gapped defence e-learning platform">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(8, 12, 20, 0.72) 0%, rgba(13, 19, 33, 0.85) 100%), url('/login-bg.jpg') no-repeat center center / cover;
            position: relative;
            background-attachment: fixed;
        }
        .login-container {
            width: 100%;
            max-width: 480px;
            position: relative;
            z-index: 10;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2.2rem;
        }
        .login-crest {
            width: 90px;
            height: 100px;
            object-fit: contain;
            display: block;
            margin: 0 auto 1.25rem;
            filter: drop-shadow(0 4px 20px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 15px rgba(212, 175, 55, 0.5));
        }
        .login-header h1 {
            font-size: 1.9rem;
            font-weight: 800;
            margin-bottom: 0.35rem;
            letter-spacing: 1px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
        }
        .login-header .motto {
            color: #f3d779;
            font-style: italic;
            font-size: 0.92rem;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }
        .login-header .subtitle {
            color: #cbd5e1;
            font-size: 0.86rem;
            margin-top: 0.3rem;
            font-weight: 500;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9);
        }
        .login-card {
            background: rgba(13, 18, 30, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            border-radius: 18px;
            padding: 2.25rem;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        .form-group {
            margin-bottom: 1.5rem;
        }
        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }
        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.18s ease;
            outline: none;
            box-sizing: border-box;
        }
        .form-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }
        .form-input::placeholder {
            color: #475569;
        }
        .btn-login {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, #8b1e2f, #b8263e);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
            margin-top: 0.5rem;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(184, 38, 62, 0.4);
        }
        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .login-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: none;
        }
        .login-error.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        .demo-credentials {
            margin-top: 2rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 1.25rem;
        }
        .demo-credentials h4 {
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #64748b;
            margin-bottom: 0.75rem;
        }
        .demo-account {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.55rem 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: 0.15s ease;
        }
        .demo-account:last-child {
            border-bottom: none;
        }
        .demo-account:hover {
            background: rgba(255, 255, 255, 0.03);
            margin: 0 -0.5rem;
            padding-left: 0.5rem;
            padding-right: 0.5rem;
            border-radius: 6px;
        }
        .demo-role {
            font-size: 0.82rem;
            font-weight: 600;
        }
        .demo-role.inst { color: #ff8595; }
        .demo-role.course { color: #f3d779; }
        .demo-role.student { color: #67e8f9; }
        .demo-user {
            font-family: monospace;
            font-size: 0.78rem;
            color: #94a3b8;
        }
        .security-notice {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.74rem;
            color: #cbd5e1;
            line-height: 1.55;
            background: rgba(13, 18, 30, 0.75);
            backdrop-filter: blur(10px);
            padding: 0.75rem 1rem;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
        }
        .security-notice strong {
            color: #f3d779;
            font-weight: 700;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="login-page">
        <div class="login-container">
            <div class="login-header">
                <img src="OTC.png" alt="OTC Crest" class="login-crest">
                <h1>EKALAVYA LMS</h1>
                <div class="motto">सर्वे सन्तु निरामयाः — May all be free from illness</div>
                <div class="subtitle">Officers Training College, AMC Centre and College, Lucknow</div>
            </div>

            <div class="login-card">
                <div class="login-error" id="login-error"></div>

                <form id="login-form" autocomplete="off">
                    <div class="form-group">
                        <label class="form-label" for="username">Service ID / Username</label>
                        <input type="text" class="form-input" id="username" name="username" placeholder="e.g. student.officer" required autofocus>
                    </div>

                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" class="form-input" id="password" name="password" placeholder="Enter your password" required>
                    </div>

                    <button type="submit" class="btn-login" id="btn-login">
                        Authenticate & Enter Portal
                    </button>
                </form>
            </div>

            <div class="security-notice">
                <strong>RESTRICTED — FOR OFFICIAL DEFENCE USE ONLY</strong><br>
                Air-gapped on-premise platform • CERT-In & ISO 27001 compliant<br>
                Unauthorized access is a punishable offence under IT Act, 2000
            </div>
        </div>
    </div>

    <script>
        // Apply saved theme preference (Dark / Light)
        const savedTheme = localStorage.getItem('ekalavya_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        // Check if already logged in
        fetch('/api/session').then(r => r.json()).then(data => {
            if (data.status === 'success' && data.data) {
                window.location.href = '/portal.html';
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const errEl = document.getElementById('login-error');
            errEl.classList.remove('visible');
            btn.disabled = true;
            btn.textContent = 'Authenticating...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                const data = await res.json();

                if (data.status === 'success') {
                    btn.textContent = 'Access Granted ✓';
                    btn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
                    setTimeout(() => {
                        window.location.href = '/portal.html';
                    }, 600);
                } else {
                    errEl.textContent = data.message || 'Authentication failed';
                    errEl.classList.add('visible');
                    btn.disabled = false;
                    btn.textContent = 'Authenticate & Enter Portal';
                }
            } catch (err) {
                errEl.textContent = 'Connection error. Ensure you are on the secure LAN.';
                errEl.classList.add('visible');
                btn.disabled = false;
                btn.textContent = 'Authenticate & Enter Portal';
            }
        });
    </script>
</body>
</html>
