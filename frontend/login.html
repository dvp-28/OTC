<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Dronacharya LMS - Officers Training College, AMC Centre and College</title>
    <meta name="description" content="Secure login portal for Dronacharya LMS - Air-gapped defence e-learning platform">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/wifi-guard.css">
    <style>
        /* Base Page Setup */
        html {
            height: 100%;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }

        *, *::before, *::after {
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif !important;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif !important;
            color: #ffffff;
            box-sizing: border-box;
            width: 100%;
            max-width: 100vw;
        }

        body, input, button, select, textarea, .form-input, .login-btn, .notice-box {
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif !important;
        }

        /* GUARANTEE BACKGROUND IMAGE /login-bg.jpg ON BOTH DARK AND LIGHT MODES */
        body,
        body.login-body,
        .login-page,
        [data-theme="dark"] body,
        [data-theme="dark"] .login-page {
            background: linear-gradient(135deg, rgba(8, 12, 20, 0.72) 0%, rgba(13, 19, 33, 0.85) 100%), url('/login-bg.jpg') no-repeat center center / cover !important;
            background-attachment: fixed !important;
        }

        [data-theme="light"] body,
        [data-theme="light"] .login-page {
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.42) 0%, rgba(241, 245, 249, 0.58) 100%), url('/login-bg.jpg') no-repeat center center / cover !important;
            background-attachment: fixed !important;
        }

        /* Official Institutional Banner */
        .otc-banner-header {
            width: 100%;
            background: linear-gradient(180deg, #880015 0%, #700010 100%);
            border-bottom: 4px solid #d4af37;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.7);
            padding: 0.75rem 2rem;
            box-sizing: border-box;
            position: relative;
            z-index: 20;
        }

        .otc-banner-container {
            max-width: 1400px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.25rem;
            box-sizing: border-box;
            padding: 0 7.5rem 0 1rem;
        }

        .otc-banner-logo {
            height: clamp(56px, 5.8vw, 84px);
            width: clamp(56px, 5.8vw, 84px);
            object-fit: contain;
            flex-shrink: 0;
            filter: drop-shadow(0 4px 14px rgba(0, 0, 0, 0.85));
        }

        .otc-banner-text {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 0;
            overflow: hidden;
        }

        .otc-banner-title {
            color: #ffffff;
            font-size: clamp(1.25rem, 2.05vw, 2.55rem);
            font-weight: 900;
            letter-spacing: clamp(0.8px, 0.15vw, 2.6px);
            line-height: 1.15;
            text-transform: uppercase;
            white-space: nowrap !important;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.95), 0 0 28px rgba(255, 255, 255, 0.3);
            margin: 0;
        }

        .otc-banner-subtitle {
            color: #ffffff;
            font-size: clamp(0.9rem, 1.4vw, 1.75rem);
            font-weight: 800;
            letter-spacing: clamp(0.6px, 0.12vw, 2px);
            line-height: 1.2;
            text-transform: uppercase;
            white-space: nowrap !important;
            text-shadow: 0 3px 12px rgba(0, 0, 0, 0.95);
            margin: 0.2rem 0 0 0;
        }

        /* Banner Theme Toggle Button - PLACED IN THE RIGHT CORNER */
        .login-theme-toggle {
            position: absolute;
            right: 2rem;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.45);
            border: 2px solid rgba(212, 175, 55, 0.5);
            color: #ffffff;
            padding: 0.55rem 1.2rem;
            border-radius: 24px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            font-size: 1rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.45);
            white-space: nowrap !important;
            z-index: 30;
        }

        .login-theme-toggle:hover {
            background: rgba(0, 0, 0, 0.75);
            border-color: #d4af37;
            box-shadow: 0 0 16px rgba(212, 175, 55, 0.65);
        }

        /* In Dark mode: show Sun icon (Action: switch to Light) */
        .login-theme-toggle .icon-sun { display: inline-block; color: #f59e0b; width: 16px; height: 16px; }
        .login-theme-toggle .icon-moon { display: none; width: 16px; height: 16px; }
        /* In Light mode: show Moon icon (Action: switch to Dark) */
        [data-theme="light"] .login-theme-toggle .icon-sun { display: none; }
        [data-theme="light"] .login-theme-toggle .icon-moon { display: inline-block; color: #880015; width: 16px; height: 16px; }

        [data-theme="light"] .login-theme-toggle {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid rgba(136, 0, 21, 0.45);
            color: #880015;
            font-weight: 800;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2);
        }

        [data-theme="light"] .login-theme-toggle:hover {
            background: #ffffff;
            border-color: #880015;
            box-shadow: 0 0 16px rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 1100px) {
            .otc-banner-header {
                padding: 0.65rem 1.25rem;
            }
            .otc-banner-container {
                padding: 0 6.5rem 0 0.5rem;
                gap: 1rem;
            }
            .otc-banner-title {
                font-size: clamp(1.2rem, 2.1vw, 2rem);
                white-space: nowrap !important;
            }
            .otc-banner-subtitle {
                font-size: clamp(0.85rem, 1.4vw, 1.4rem);
                white-space: nowrap !important;
            }
            .otc-banner-logo {
                height: 64px;
                width: 64px;
            }
            .login-theme-toggle {
                right: 1.25rem;
                padding: 0.48rem 1rem;
                font-size: 0.92rem;
            }
        }

        @media (max-width: 900px) {
            .otc-banner-header {
                padding: 0.6rem 1rem;
            }
            .otc-banner-container {
                padding: 0 5rem 0 0.5rem;
                gap: 0.75rem;
            }
            .otc-banner-title {
                font-size: clamp(1.05rem, 2.1vw, 1.6rem);
                white-space: nowrap !important;
            }
            .otc-banner-subtitle {
                font-size: clamp(0.78rem, 1.4vw, 1.15rem);
                white-space: nowrap !important;
            }
            .otc-banner-logo {
                height: 52px;
                width: 52px;
            }
            .login-theme-toggle {
                right: 0.75rem;
                padding: 0.42rem 0.85rem;
                font-size: 0.85rem;
            }
        }

        @media (max-width: 600px) {
            .otc-banner-container {
                display: flex;
                flex-direction: column;
                gap: 0.5rem;
                padding: 0 0.5rem;
            }
            .otc-banner-logo {
                height: 46px;
                width: 46px;
            }
            .otc-banner-title {
                font-size: clamp(1rem, 3.6vw, 1.35rem);
                letter-spacing: 0.8px;
                white-space: nowrap !important;
            }
            .otc-banner-subtitle {
                font-size: clamp(0.75rem, 2.6vw, 1rem);
                letter-spacing: 0.6px;
                white-space: nowrap !important;
            }
            .login-theme-toggle {
                position: static;
                transform: none;
                margin-top: 0.25rem;
            }
        }

        /* Main Content & Login Card Layout */
        .login-main,
        .login-page,
        [data-theme="dark"] .login-main,
        [data-theme="dark"] .login-page,
        [data-theme="light"] .login-main,
        [data-theme="light"] .login-page {
            flex: 1;
            min-height: 0 !important;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 0.45rem 2rem 0.45rem 2rem !important;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
            width: 100%;
        }

        .login-content-wrapper {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 0.5rem 1.5rem;
        }

        .login-header {
            text-align: center;
            margin: 0 auto 1.65rem auto;
            width: 100%;
            max-width: 1050px;
            padding: 0 1rem;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .login-header h1 {
            font-size: clamp(2.2rem, 3.2vw, 3.5rem);
            font-weight: 900;
            margin: 0 0 0.3rem 0;
            letter-spacing: clamp(1.5px, 0.25vw, 3.5px);
            line-height: 1.15;
            color: #ffffff;
            white-space: nowrap !important;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95), 0 0 35px rgba(0, 0, 0, 0.8);
        }

        .login-header .motto {
            color: #fde047;
            font-style: italic;
            font-size: clamp(1.1rem, 1.4vw, 1.6rem);
            font-weight: 800;
            letter-spacing: 0.95px;
            line-height: 1.25;
            margin: 0;
            white-space: nowrap !important;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.95);
        }

        /* LIGHT MODE - HERO TYPOGRAPHY */
        [data-theme="light"] .login-header h1 {
            color: #0b1329;
            font-size: clamp(2.2rem, 3.2vw, 3.5rem);
            font-weight: 900;
            letter-spacing: clamp(1.5px, 0.25vw, 3.5px);
            line-height: 1.15;
            white-space: nowrap !important;
            text-shadow: 0 2px 14px rgba(255, 255, 255, 1), 0 0 25px rgba(255, 255, 255, 0.95);
        }

        [data-theme="light"] .login-header .motto {
            color: #880015;
            font-size: clamp(1.1rem, 1.4vw, 1.6rem);
            font-weight: 800;
            letter-spacing: 0.95px;
            line-height: 1.25;
            margin: 0;
            white-space: nowrap !important;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.98), 0 0 15px rgba(255, 255, 255, 0.9);
        }

        .login-container {
            width: 100%;
            max-width: 630px;
            margin: 0 auto;
        }

        .login-card {
            background: rgba(13, 18, 30, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(212, 175, 55, 0.45);
            border-radius: 24px;
            padding: 2.25rem 2.85rem;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            box-sizing: border-box;
        }

        [data-theme="light"] .login-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 2px solid rgba(136, 0, 21, 0.35);
            box-shadow: 0 25px 65px rgba(0, 0, 0, 0.25);
        }

        .form-group {
            margin-bottom: 1.35rem;
        }

        .form-label {
            display: block;
            font-size: 1.28rem;
            font-weight: 800;
            color: #e2e8f0;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 0.65rem;
        }

        [data-theme="light"] .form-label {
            color: #0f172a;
            font-size: 1.28rem;
            font-weight: 800;
            letter-spacing: 1.2px;
        }

        .form-input {
            width: 100%;
            padding: 1.2rem 1.45rem;
            background: rgba(255, 255, 255, 0.07);
            border: 2px solid rgba(255, 255, 255, 0.22);
            border-radius: 14px;
            color: #ffffff;
            font-size: 1.34rem;
            font-weight: 600;
            font-family: inherit;
            transition: 0.18s ease;
            outline: none;
            box-sizing: border-box;
        }

        .form-input::placeholder {
            color: #94a3b8;
            font-size: 1.26rem;
            font-weight: 500;
        }

        .form-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.28);
            background: rgba(255, 255, 255, 0.1);
        }

        [data-theme="light"] .form-input {
            background: #ffffff;
            border: 2px solid #64748b;
            color: #0f172a;
            font-size: 1.34rem;
            font-weight: 600;
        }

        [data-theme="light"] .form-input::placeholder {
            color: #64748b;
            font-size: 1.26rem;
            font-weight: 500;
        }

        [data-theme="light"] .form-input:focus {
            border-color: #880015;
            box-shadow: 0 0 0 4px rgba(136, 0, 21, 0.25);
        }

        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }

        .password-wrapper .form-input {
            padding-right: 3.5rem !important;
        }

        .password-toggle-btn {
            position: absolute;
            right: 0.95rem;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            padding: 0.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #94a3b8;
            border-radius: 8px;
            transition: color 0.18s ease, background 0.18s ease, transform 0.12s ease;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .password-toggle-btn:hover {
            color: #d4af37;
            background: rgba(255, 255, 255, 0.08);
        }

        .password-toggle-btn:active {
            transform: translateY(-50%) scale(0.92);
        }

        [data-theme="light"] .password-toggle-btn {
            color: #64748b;
        }

        [data-theme="light"] .password-toggle-btn:hover {
            color: #880015;
            background: rgba(0, 0, 0, 0.06);
        }

        .btn-login {
            width: 100%;
            padding: 1.2rem 1.6rem;
            background: linear-gradient(135deg, #880015, #b8263e);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 14px;
            font-size: 1.42rem;
            font-weight: 800;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.85rem;
            box-sizing: border-box;
            box-shadow: 0 6px 22px rgba(184, 38, 62, 0.48);
            white-space: nowrap !important;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 26px rgba(184, 38, 62, 0.6);
            background: linear-gradient(135deg, #a1001a, #cc2a45);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .login-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1.5px solid rgba(239, 68, 68, 0.5);
            color: #fca5a5;
            padding: 1rem 1.35rem;
            border-radius: 12px;
            font-size: 1.08rem;
            font-weight: 600;
            margin-bottom: 1.35rem;
            display: none;
            box-sizing: border-box;
        }

        .login-error.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        [data-theme="light"] .login-error {
            background: #fef2f2;
            border: 1.5px solid #f87171;
            color: #991b1b;
        }

        /* Invalid login with remaining attempts */
        .login-attempt-warning {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            flex-wrap: wrap;
        }

        .login-attempt-msg {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.05rem;
            font-weight: 600;
        }

        .attempts-left-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(239, 68, 68, 0.25);
            border: 1.5px solid #ef4444;
            color: #fee2e2;
            padding: 0.32rem 0.8rem;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        [data-theme="light"] .attempts-left-pill {
            background: #fee2e2;
            border-color: #dc2626;
            color: #991b1b;
        }

        /* Lockout Expired Success State */
        .lockout-expired-box {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            color: #22c55e;
            font-weight: 700;
            font-size: 1.05rem;
        }

        [data-theme="light"] .lockout-expired-box {
            color: #15803d;
        }

        /* RESTRICTED DEFENCE NOTICE (STRICTLY SINGLE HORIZONTAL LINE) */
        .security-notice {
            display: inline-flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: center !important;
            flex-wrap: nowrap !important;
            white-space: nowrap !important;
            text-align: center;
            margin: 0.25rem auto 0.35rem auto;
            font-size: clamp(0.55rem, 0.7vw, 0.88rem);
            color: #f1f5f9;
            line-height: 1.35;
            background: rgba(13, 18, 30, 0.94);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 0.42rem clamp(0.75rem, 1.3vw, 1.6rem);
            border-radius: 9999px !important;
            border: 1.8px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.75);
            max-width: 98vw;
            width: max-content;
            box-sizing: border-box;
            z-index: 10;
            flex-shrink: 0;
            gap: clamp(0.35rem, 0.55vw, 0.7rem);
        }

        .security-notice span,
        .security-notice .sec-restricted,
        .security-notice .sec-sep {
            white-space: nowrap !important;
            display: inline-block;
        }

        .security-notice .sec-restricted {
            color: #fde047;
            font-size: 1.18em;
            font-weight: 900;
            letter-spacing: 0.8px;
        }

        .security-notice .sec-sep {
            color: #fde047;
            font-size: 1.25em;
            font-weight: 900;
        }

        [data-theme="light"] .security-notice {
            background: rgba(255, 255, 255, 0.97);
            color: #0f172a;
            border: 2px solid rgba(136, 0, 21, 0.4);
            box-shadow: 0 4px 22px rgba(0, 0, 0, 0.18);
        }

        [data-theme="light"] .security-notice .sec-restricted {
            color: #880015;
            font-size: 1.18em;
            font-weight: 900;
            letter-spacing: 0.8px;
        }

        [data-theme="light"] .security-notice .sec-sep {
            color: #880015;
            font-size: 1.25em;
            font-weight: 900;
        }

        [data-theme="light"] .security-notice span {
            font-weight: 700;
        }

        /* Compact Laptop Support (Ensures 0 Scroll, 100% Visibility at height <= 720px) */
        @media (max-height: 720px) {
            .otc-banner-header {
                padding: 0.52rem 1.5rem;
            }
            .otc-banner-logo {
                height: 58px;
                width: 58px;
            }
            .otc-banner-title {
                font-size: clamp(1.15rem, 1.85vw, 1.95rem);
                white-space: nowrap !important;
            }
            .otc-banner-subtitle {
                font-size: clamp(0.82rem, 1.3vw, 1.35rem);
                white-space: nowrap !important;
            }
            .login-main,
            .login-page,
            [data-theme="dark"] .login-main,
            [data-theme="dark"] .login-page,
            [data-theme="light"] .login-main,
            [data-theme="light"] .login-page {
                padding: 0.25rem 1.5rem !important;
            }
            .login-content-wrapper {
                padding: 0.15rem 1rem;
            }
            .login-header {
                margin: 0 auto 0.65rem auto;
            }
            .login-header h1,
            [data-theme="light"] .login-header h1 {
                font-size: clamp(1.85rem, 2.5vw, 2.6rem);
                margin: 0 0 0.15rem 0;
                white-space: nowrap !important;
            }
            .login-header .motto,
            [data-theme="light"] .login-header .motto {
                font-size: clamp(0.95rem, 1.15vw, 1.25rem);
                white-space: nowrap !important;
            }
            .login-container {
                max-width: 520px;
            }
            .login-card {
                padding: 1.25rem 1.9rem;
                border-radius: 18px;
            }
            .form-group {
                margin-bottom: 0.75rem;
            }
            .form-label,
            [data-theme="light"] .form-label {
                font-size: 1.02rem;
                margin-bottom: 0.28rem;
            }
            .form-input,
            [data-theme="light"] .form-input {
                padding: 0.7rem 1.1rem;
                font-size: 1.08rem;
            }
            .btn-login {
                padding: 0.8rem 1.2rem;
                font-size: 1.18rem;
                margin-top: 0.4rem;
                white-space: nowrap !important;
            }
            .security-notice {
                margin: 0.15rem auto 0.2rem auto;
                padding: 0.3rem 1.15rem;
                font-size: clamp(0.52rem, 0.68vw, 0.82rem);
                white-space: nowrap !important;
            }
        }

        @media (max-width: 900px) {
            body {
                overflow-y: auto;
                height: auto;
                min-height: 100vh;
            }
            .login-content-wrapper {
                justify-content: center;
                padding: 0 1rem;
            }
            .login-header {
                margin: 0 auto 1.25rem auto;
            }
            .login-header h1,
            [data-theme="light"] .login-header h1 {
                font-size: 2.6rem;
                letter-spacing: 2px;
                white-space: nowrap !important;
            }
            .login-header .motto,
            [data-theme="light"] .login-header .motto {
                font-size: 1.3rem;
                white-space: nowrap !important;
            }
            .login-container {
                max-width: 540px;
                width: 92vw;
            }
            .login-card {
                padding: 1.8rem 2rem;
            }
            .form-label,
            [data-theme="light"] .form-label {
                font-size: 1.1rem;
            }
            .form-input,
            [data-theme="light"] .form-input {
                font-size: 1.18rem;
                padding: 0.95rem 1.2rem;
            }
            .btn-login {
                font-size: 1.26rem;
                padding: 1rem 1.35rem;
                white-space: nowrap !important;
            }
            .security-notice {

                flex-direction: row !important;

                border-radius: 9999px !important;

                padding: 0.38rem 1rem !important;
                gap: 0.45rem !important;

            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
