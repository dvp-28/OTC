<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Dronacharya LMS - Officers Training College, AMC Centre and College</title>
    <meta name="description" content="Secure login portal for Dronacharya LMS - Air-gapped defence e-learning platform">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Base Page Setup */
        html {
            height: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #ffffff;
            box-sizing: border-box;
        }

        /* GUARANTEE BACKGROUND IMAGE /login-bg.jpg ON BOTH DARK AND LIGHT MODES */
        body,
        body.login-body,
        .login-page,
        [data-theme="dark"] body,
        [data-theme="dark"] .login-page {
            background: linear-gradient(135deg, rgba(8, 12, 20, 0.72) 0%, rgba(13, 19, 33, 0.85) 100%), url('/login-bg.jpg') no-repeat center center / cover !important;
            background-attachment: fixed !important;
        }

        [data-theme="light"] body,
        [data-theme="light"] .login-page {
            background: linear-gradient(135deg, rgba(248, 250, 252, 0.42) 0%, rgba(241, 245, 249, 0.58) 100%), url('/login-bg.jpg') no-repeat center center / cover !important;
            background-attachment: fixed !important;
        }

        /* Official Institutional Banner */
        .otc-banner-header {
            width: 100%;
            background: linear-gradient(180deg, #880015 0%, #700010 100%);
            border-bottom: 3px solid #d4af37;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            padding: 0.45rem 2rem;
            box-sizing: border-box;
            position: relative;
            z-index: 20;
        }

        .otc-banner-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .otc-banner-logo {
            height: 60px;
            width: 60px;
            object-fit: contain;
            flex-shrink: 0;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.6));
        }

        .otc-banner-text {
            flex: 1;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .otc-banner-title {
            color: #ffffff;
            font-size: 1.85rem;
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1.15;
            text-transform: uppercase;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8), 0 0 15px rgba(255, 255, 255, 0.2);
            margin: 0;
        }

        .otc-banner-subtitle {
            color: #ffffff;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 1.8px;
            line-height: 1.2;
            text-transform: uppercase;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.8);
            margin: 0.15rem 0 0 0;
        }

        /* Banner Theme Toggle Button */
        .login-theme-toggle {
            position: absolute;
            right: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(212, 175, 55, 0.4);
            color: #ffffff;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            font-size: 0.76rem;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            z-index: 30;
        }

        .login-theme-toggle:hover {
            background: rgba(0, 0, 0, 0.75);
            border-color: #d4af37;
            box-shadow: 0 0 12px rgba(212, 175, 55, 0.45);
        }

        /* In Dark mode: show Sun icon (Action: switch to Light) */
        .login-theme-toggle .icon-sun { display: inline-block; color: #f59e0b; }
        .login-theme-toggle .icon-moon { display: none; }
        /* In Light mode: show Moon icon (Action: switch to Dark) */
        [data-theme="light"] .login-theme-toggle .icon-sun { display: none; }
        [data-theme="light"] .login-theme-toggle .icon-moon { display: inline-block; color: #8b1e2f; }

        @media (max-width: 1100px) {
            .login-theme-toggle {
                position: static;
                transform: none;
                margin: 0.4rem auto 0;
            }
            .otc-banner-header {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        }

        @media (max-width: 900px) {
            .otc-banner-header {
                padding: 0.5rem 1rem;
            }
            .otc-banner-logo {
                height: 52px;
                width: 52px;
            }
            .otc-banner-title {
                font-size: 1.35rem;
                letter-spacing: 1.2px;
            }
            .otc-banner-subtitle {
                font-size: 1.1rem;
                letter-spacing: 1px;
            }
        }

        @media (max-width: 600px) {
            .otc-banner-logo {
                height: 42px;
                width: 42px;
            }
            .otc-banner-title {
                font-size: 1.05rem;
                letter-spacing: 0.8px;
            }
            .otc-banner-subtitle {
                font-size: 0.85rem;
                letter-spacing: 0.8px;
            }
        }

        /* Main Content & Login Card Layout */
        .login-main {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 0.5rem 2rem 0.45rem 2rem;
            box-sizing: border-box;
            position: relative;
            z-index: 10;
            width: 100%;
        }

        .login-header {
            text-align: center;
            margin: 0.1rem auto 0.35rem auto;
            width: 100%;
            max-width: 900px;
            padding: 0 1rem;
            box-sizing: border-box;
            flex-shrink: 0;
        }

        .login-header h1 {
            font-size: 2.2rem;
            font-weight: 900;
            margin: 0 0 0.2rem 0;
            letter-spacing: 2px;
            color: #ffffff;
            text-shadow: 0 2px 14px rgba(0, 0, 0, 0.95), 0 0 25px rgba(0, 0, 0, 0.7);
        }

        .login-header .motto {
            color: #f3d779;
            font-style: italic;
            font-size: 0.98rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.95);
        }

        .login-content-wrapper {
            width: 100%;
            flex: 1;
            min-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            padding: 0 1.5rem;
        }

        .login-container {
            width: 100%;
            max-width: 440px;
            margin: 0 auto;
        }

        .login-card {
            background: rgba(13, 18, 30, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.28);
            border-radius: 18px;
            padding: 1.65rem 1.75rem;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            box-sizing: border-box;
        }

        [data-theme="light"] .login-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.4);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.22);
        }

        [data-theme="light"] .login-header h1 {
            color: #0f172a;
            text-shadow: 0 2px 8px rgba(255, 255, 255, 0.9), 0 0 16px rgba(255, 255, 255, 0.6);
        }

        [data-theme="light"] .login-header .motto {
            color: #8b6508;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.8);
        }

        [data-theme="light"] .login-header .subtitle {
            color: #1e293b;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.8);
        }

        [data-theme="light"] .form-label {
            color: #334155;
        }

        [data-theme="light"] .form-input {
            background: #ffffff;
            border: 1px solid #cbd5e1;
            color: #0f172a;
        }

        [data-theme="light"] .form-input:focus {
            border-color: #880015;
            box-shadow: 0 0 0 3px rgba(136, 0, 21, 0.18);
        }

        .form-group {
            margin-bottom: 1.15rem;
        }

        .form-label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
        }

        .form-input {
            width: 100%;
            padding: 0.85rem 1rem;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.14);
            border-radius: 10px;
            color: #f1f5f9;
            font-size: 0.95rem;
            font-family: inherit;
            transition: 0.18s ease;
            outline: none;
            box-sizing: border-box;
        }

        .form-input:focus {
            border-color: #d4af37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.18);
            background: rgba(255, 255, 255, 0.07);
        }

        .form-input::placeholder {
            color: #475569;
        }

        .btn-login {
            width: 100%;
            padding: 0.95rem;
            background: linear-gradient(135deg, #880015, #b8263e);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
            box-sizing: border-box;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(184, 38, 62, 0.45);
            background: linear-gradient(135deg, #a1001a, #cc2a45);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .login-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #fca5a5;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1.25rem;
            display: none;
        }

        .login-error.visible {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        .security-notice {
            text-align: center;
            margin: 0.25rem auto 0.45rem auto;
            font-size: 0.74rem;
            color: #e2e8f0;
            line-height: 1.45;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.4rem 1.75rem;
            border-radius: 10px;
            border: 1px solid rgba(212, 175, 55, 0.35);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.65);
            max-width: 680px;
            width: auto;
            box-sizing: border-box;
            z-index: 10;
            flex-shrink: 0;
        }

        [data-theme="light"] .security-notice {
            background: rgba(255, 255, 255, 0.88);
            color: #334155;
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        }

        .security-notice strong {
            color: #f3d779;
            font-weight: 700;
        }

        [data-theme="light"] .security-notice strong {
            color: #880015;
            font-weight: 700;
        }

        @media (max-width: 900px) {
            .login-content-wrapper {
                justify-content: center;
                padding: 0 1rem;
            }
            .login-header {
                margin: 0.25rem auto 1rem auto;
            }
            .login-header h1 {
                font-size: 1.65rem;
                letter-spacing: 1.2px;
            }
            .login-header .motto {
                font-size: 0.9rem;
            }
            .login-main {
                padding: 1rem 1rem 1.25rem 1rem;
            }
            .security-notice {
                font-size: 0.7rem;
                padding: 0.5rem 0.75rem;
                margin-top: 0.75rem;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="login-body">
    <!-- Institutional Top Banner (Officers Training College / AMC Centre & College) -->
    <header class="otc-banner-header">
        <div class="otc-banner-container">
            <img src="OTC.png" alt="AMC Centre & College Crest" class="otc-banner-logo left">
            <div class="otc-banner-text">
                <h1 class="otc-banner-title">OFFICERS TRAINING COLLEGE</h1>
                <h2 class="otc-banner-subtitle">AMC CENTRE &amp; COLLEGE</h2>
            </div>
            <img src="college-crest.png" alt="Officers Training College Crest" class="otc-banner-logo right">
        </div>

        <!-- Quick Theme Switcher -->
        <button class="login-theme-toggle" id="theme-toggle-btn" title="Switch Theme (Dark / Light)">
            <svg class="icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            <svg class="icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            <span id="theme-label-text">Light</span>
        </button>
    </header>

    <!-- Main Login Area with .login-page class -->
    <main class="login-main login-page">
        <!-- Top Center Title and Motto -->
        <div class="login-header">
            <h1>DRONACHARYA LMS</h1>
            <div class="motto">सर्वे सन्तु निरामयाः — May all be free from illness</div>
        </div>

        <!-- Main Content Area with Login Centered -->
        <div class="login-content-wrapper">
            <div class="login-container">
                <div class="login-card">
                    <div class="login-error" id="login-error"></div>

                    <form id="login-form" autocomplete="off">
                        <div class="form-group">
                            <label class="form-label" for="username">Service ID / Username</label>
                            <input type="text" class="form-input" id="username" name="username" placeholder="e.g. student.officer" required autofocus>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="password">Password</label>
                            <input type="password" class="form-input" id="password" name="password" placeholder="Enter your password" required>
                        </div>

                        <button type="submit" class="btn-login" id="btn-login">
                            Authenticate &amp; Enter Portal
                        </button>
                    </form>
                </div>
            </div>
        </div>

        <!-- Bottom of the page: Restricted Defence Section -->
        <div class="security-notice">
            <strong>RESTRICTED — FOR OFFICIAL DEFENCE USE ONLY</strong><br>
            Air-gapped on-premise platform • CERT-In &amp; ISO 27001 compliant<br>
            Unauthorized access is a punishable offence under IT Act, 2000
        </div>
    <script src="js/login.js"></script>
</body>
</html>
