<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dronacharya LMS | Officers Training College</title>
    <script>
        // Check session and redirect
        fetch('/api/session').then(r => r.json()).then(data => {
            if (data.status === 'success' && data.data) {
                if (data.csrf_token) {
                    sessionStorage.setItem('ek_csrf_token', data.csrf_token);
                }
                window.location.href = '/portal.html';
            } else {
                window.location.href = '/login.html';
            }
        }).catch(() => {
            window.location.href = '/login.html';
        });
    </script>
</head>
<body style="background: #0a0d14; color: #f1f5f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: sans-serif;">
    <p>Loading Dronacharya LMS...</p>
</body>
</html>
