# Ekalavya LMS - local development stack
#
# Each service maps to a VM on the client's single central server:
#   proxy                 -> Proxy VM     (TLS, WAF, the only thing exposed to the LAN)
#   web, php, cron, redis -> App VM       (Moodle)
#   db                    -> Database VM  (MySQL)
#   (matomo, logs, backup -> Ops VM, added later in the plan)
#
# Networks mimic the zone separation and are "internal" (no internet egress),
# so you discover air-gap problems on your laptop, not at the client site.

name: ekalavya

services:
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/proxy/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
    networks: [edge, app]
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    volumes:
      - ./docker/web/moodle.conf:/etc/nginx/conf.d/default.conf:ro
      - ./moodle-src:/var/www/moodle:ro
      - moodledata:/var/www/moodledata:ro
    depends_on:
      - php
    networks: [app]
    restart: unless-stopped

  php:
    build: ./docker/php
    env_file: .env
    volumes:
      - ./moodle-src:/var/www/moodle
      - ./config/config.php:/var/www/moodle/config.php:ro
      - ./scripts:/opt/ekalavya/scripts:ro
      - moodledata:/var/www/moodledata
      - localcache:/var/www/localcache
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [app, data]
    restart: unless-stopped

  cron:
    build: ./docker/php
    env_file: .env
    user: www-data
    command: ["bash", "/opt/ekalavya/scripts/cron-loop.sh"]
    volumes:
      - ./moodle-src:/var/www/moodle
      - ./config/config.php:/var/www/moodle/config.php:ro
      - ./scripts:/opt/ekalavya/scripts:ro
      - moodledata:/var/www/moodledata
      - localcache:/var/www/localcache
    depends_on:
      - php
    networks: [app, data]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\" --save '' --appendonly no"]
    env_file: .env
    networks: [app]
    restart: unless-stopped

  db:
    image: mysql:8.4
    env_file: .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=1G
      - --max-connections=300
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [data]
    restart: unless-stopped

networks:
  edge: {}                  # LAN-facing: only the proxy lives here
  app:
    internal: true          # app zone: no internet access
    ipam:
      config:
        - subnet: 172.28.10.0/24   # must match TRUSTED_PROXY_SUBNET in .env
  data:
    internal: true          # data zone: reachable only from php/cron

volumes:
  moodledata: {}
  localcache: {}
  dbdata: {}
