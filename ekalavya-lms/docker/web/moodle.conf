# App VM: nginx in front of PHP-FPM, serving Moodle.
# Moodle 5.1+ serves from the public/ folder of the checkout.
server {
    listen 80;
    server_name _;
    server_tokens off;

    root  /var/www/moodle/public;
    index index.php;
    client_max_body_size 256M;

    # Never serve dev/internal files
    location ~ (/vendor/|/node_modules/|composer\.(json|lock)|/readme|/README|readme\.txt|/upgrade\.txt|/UPGRADING\.md|db/install\.xml|/fixtures/|/behat/|phpunit\.xml|\.lock|environment\.xml|/\.git) {
        deny all;
        return 404;
    }

    # Moodle 5.x routing: unknown paths go to r.php
    location / {
        try_files $uri $uri/ /r.php$is_args$args;
    }

    location ~ [^/]\.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_index           index.php;
        fastcgi_pass            php:9000;
        include                 fastcgi_params;
        fastcgi_param PATH_INFO       $fastcgi_path_info;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout    300s;
    }

    # Files are served by nginx after PHP checks permissions (X-Accel-Redirect).
    # This keeps PHP workers free while videos stream.
    location /dataroot/ {
        internal;
        alias /var/www/moodledata/;
    }
}
