[www]
; Moodle's config.php reads settings from environment variables,
; and PHP-FPM wipes the environment by default.
clear_env = no

; Tune these during load testing (Oct 22)
pm = dynamic
pm.max_children = 40
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500
