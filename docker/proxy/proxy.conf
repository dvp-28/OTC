# Proxy VM: TLS termination + security headers (Hardened for Air-Gapped Military Deployment)
server_tokens off;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ekalavya.local;

    ssl_certificate     /etc/nginx/certs/ekalavya.crt;
    ssl_certificate_key /etc/nginx/certs/ekalavya.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache   shared:SSL:10m;

    # Edge Security Headers (SEC-G01, SEC-G03, SEC-G05)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    client_max_body_size 256M;

    # API endpoints connecting to Moodle micro-router
    location /api/ {
        proxy_pass         http://web:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_hide_header  X-Powered-By;
        proxy_read_timeout 300s;
    }

    # Moodle Core native administration paths - restricted to authorized management subnets (SEC-G04)
    location ~ ^/(admin)/ {
        allow 127.0.0.1;
        allow 172.16.0.0/12;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        deny all;

        proxy_pass         http://web:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_hide_header  X-Powered-By;
        proxy_read_timeout 300s;
    }

    # Moodle Core auxiliary paths required for student & course access
    location ~ ^/(login|course|user|mod|grade|my|calendar|message|enrol|lib|theme)/ {
        proxy_pass         http://web:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_hide_header  X-Powered-By;
        proxy_read_timeout 300s;
    }

    # Headless HTML5/CSS/JS frontend
    location / {
        root  /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
