# Proxy VM: TLS termination + security headers. ModSecurity WAF is added on Oct 14.
server_tokens off;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ekalavya.local;

    ssl_certificate     /etc/nginx/certs/ekalavya.crt;
    ssl_certificate_key /etc/nginx/certs/ekalavya.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 256M;   # large videos go via the bulk upload script, not the browser

    # API endpoints connecting to Moodle MySQL
    location /api/ {
        proxy_pass         http://web:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Moodle Core native administration paths
    location ~ ^/(admin|login|course|user|mod|grade|my|calendar|message|enrol|lib|theme)/ {
        proxy_pass         http://web:80;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    # Headless HTML5/CSS/JS frontend
    location / {
        root  /var/www/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
